front:
  text: 補遺
  hash: sha256:bd2cfbe2e573f75b0238d4c77612cc22732bf27e84ce467a91065d0fac47cf38
  markers:
  - {type: page-break, offset: 0, content: '', id: KR4e0110_WYG_003-1a, image: WYG1246/WYG1246-0513a.png}
body:
  text: 詩讀宋陳忠肅公傳有感見莆陽文獻邊塵捲風天地黑鐵騎長驅滿南北厓山孤主知在無一夜愁心徧頭白丈夫恥作負恩生舉手擎天天已傾孤城如斗猶百戰蒼蒼不遣功勛成龍虎可騎不可擾怒氣吹人山亦倒君臣大義心自明白日青天懸皎皎嶺海間闗草樹寒四顧無人雙淚彈國破家亡惟一死首陽有薇􅃚忍餐節義文章理不爛萬丈紅光燭霄漢我懐往事悲復歌凛凛英風鬢絲亂對雪作見莆風清籟集去年臘月江南村梅花如雪飛紛紛今年飽看京城雪色比梅花更清絶繁弦急管是誰家流蘇帳暖傾流霞何如金馬門中客瓦鼎敲氷閒煑茶玉樓稜層銀海動自笑書生能忍凍漏聲催就碧窻眠一夜寒光照清夢送檢討莊孔陽桂陽判官見莆陽文獻鐘聲催曉騎寒色上重裘笑别鵷鴻侣遥臨山水州直言非不用髙志自難酬公暇閒吟處風清月滿樓遊靈雲寺以下二首見莆風清籟集朝回天尚早騎馬到巖扉澗水流花去山雲載鶴歸和羮芹菜嫩薦酒蕨芽肥適意坐來乆空嵐吹滿衣辟支巖按黄仲昭未軒集登辟支巖追次柯竹巖韻共二首此其第一首也其第二首失載攀雲凌絶頂一望海天空野色斷橋外鳥聲髙樹中烟凝芳草碧苔襯落花紅萬慮都消却長歌送暮鴻送行人司正邵震使安南見莆陽文獻天王出震繼虞唐宇宙重新化日長要使車書歸一統逺頒正朔到殊方碧天盡處通容管瘴雨晴時過冨良珍重平生清苦節莫將薏苡載歸囊無題和義山原本四首今僅存二首以下見莆風清籟集翠袖湘裾立曉風綘紗窓外畫闌東傷心玉笛聲初斷回首瑶䑓信未通滿地淡烟芳草碧一簾殘雨落花紅年來但守芳心在兩鬢從教似短蓬人在蓬萊欲見難重門花落又春殘驚回逺夢鶯猶語題就長緘硯已乾雲母屏前香縷細水晶簾外雨聲寒篋中舊製雙紈扇愁拂塵埃强自看三月晦日作斗室翛翛半掩扉一春多病賞心違東風不忍輕相别吹送楊花滿院飛棠梨白頭開到棠梨春事休紅情緑意總堪愁雙禽無計留春住恨倚東風雪滿頭文送兵部尚書王公還河州序以下二首見莆陽文獻兵部尚書戇菴王公方五十二以病乞歸河州䟽五上上始賜俞允且謂疾己當復來命下薦紳大夫共惜其去而其中有為國家愛重賢才且知公者惜之尤深海内之士游學于都下者多踵門投詩誦其賢髙其節以寫平生傾慕之意至于武夫悍卒庸人孺子聞公之去亦皆齎咨涕洟欲挽留之不可得獨憸邪怪巧之徒為公所摧抑奄奄側目思欲起而不能者則喜而相賀曰公去吾屬可無患矣又相與言曰貴勢之圖去公誰復阻我哉葢公自少負氣節讀經史以古之光明磊落者自期正統己巳舉進士為戸科給事中輙言事無所顧避風采英英動人庚午土木之變廷臣抗䟽論權奸誤國之罪又擊死餘黨三人公實倡之既而敵騎薄都城公督兵拒守敵知有偹隨遁去尋陞右僉都御史守紫荆居庸二闗又督修闗南北三城相山之髙峻者為墩臺數處分兵守瞭皆足為經乆之計景泰辛未奉命往淮揚緿督漕運兼廵撫之仕風清弊絶國用足而民不擾淮徐之間嘗連歲水災且大疫公大發官廪及斂冨人所輸之粟厚賑䘏之又為病坊處疾病之無歸者擇良醫四十軰屬以視藥食令無失所活垂死之民餘二百萬其死而有子孫來告者予棺暴骨于野者使在䖏隨收瘞之時朝廷聞民饑餓遣使助公理荒政至則公已經營綏輯而民皆得所矣使還奏公之績乞賜褒崇公且馳疏自劾不能恤民患又言謹天戒嘗以進君子退小人為先還朝上念其功陞為左副都御史仍莅淮揚又上疏陳致治保邦十二事其言多諷權貴人上嘉納之天順初元權貴人隂中以事罷歸里居無懟色悉謝絶賔友閉門讀書時出展先隴不復他往辛巳秋敵寇入莊浪起公仍舊職參賛軍務宼平復奉命理漕運公至徐百姓扶老攜幼迎候水次歡聲徹逺邇比就館衆擁入羅拜歌呼連三日乃止至淮亦然而漕運之政乆廢於是復經理如初去年以廷論擢公為尚書公收用才良屏棄姦佞思修舉廢墜以佐聖天子興太平之治而早夜䆒心屢至忘寢食及以病在告猶懇懇然以邊事未寜為念此其忠義凱切自始仕迄今未嘗一日忘于懐所謂頽嵩岱而不能壓者故其去也君子以為憂而小人以為幸也然公有恩于民有功于國家天報之以福盖未艾而勿藥之喜將不旋踵見矣公當促駕而來使憂者以樂幸者銷沮其心而與傑士戮力國事以畢懐忠抱義之志願然後退而休焉以收知止不辱之完名此予與天下士之所共望也因書以為送行序撫州府學重修記皇帝光復寳位以來屢詔天下有司興學以崇化本而學之興能稱上㫖者盖鮮吾莆周君瑩以水部主事擢守撫郡既至首謁夫子廟退而周眎學舍皆敝陋大懼廢墜教基遂諗諸寮佐以公錢修之廟自大成殿東西序㦸門靈星門學自明倫堂以及肄業之齋㑹饌庖廪之所工繕材良各得其度至于文昌樓洗墨池皆治以為髙明息游之具盖往來之人莫知其經始而特見其成既成教授李慶以書來言曰撫郡在唐時惟有夫子廟天復二年刺史危全諷立也宋慶厯間郡守馬尋復增立學其制始備是後屢壊而屢有修之者然率皆茍簡修未幾而壊隨之未有如今之既完且固為可乆也願有記余觀理財聼獄凡起廢决滯之方皆世吏之所用心以為才者也然非為政之本用心雖勞而治不效則怒而號曰何民之難理也獨未知君子之政有易勞以為逸去難而為易者焉興學教士是已葢人之起居飲食動作至于修身為國家天下皆自學出其教之也有師友之資有勸懲之則積而至于歲月之乆其化之行則紀綱修明其才之成則公卿大夫百執之選得其士其居常也誾誾秩秩可挹而親其或臨大節也浩乎不可摧奪彼瑣瑣世吏之所用心者其效曾有是乎故古之良吏載于史籍者多而文翁之守蜀褒然為首稱也周君讀經書尢精于詩逹于政世吏之所趨向者不暇為其棄不務者則先之故朝至郡而夕舉興學之政以作士民文翁葢不得專美于漢也郡之人登文昌之樓有堰隆然將復合乎則為我謝周君曰是乃天兆嘉祥以彰知木崇化之政黄震之謂第一流人物復出矣余於是時尚有以頌君者姑為之記修學之成使刻于石以俟
