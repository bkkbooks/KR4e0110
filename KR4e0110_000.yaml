body:
  text: 竹巖集别集類五明提要臣等謹案竹巖集一卷文集一卷補遺一卷明柯潛撰潛字孟時號竹巖莆田人景泰辛未進士第一官至詹事府少詹事事迹具明史本傳潛在當時負詞林宿望流風餘韻蔭映玉堂嘗就後圃結清風亭一區手植雙柏數百年傳為古迹即所謂柯亭與學士柏者也柏已不存而柯亭之號得入御製臨幸翰林院詩其名益著惟文集乃傳本甚稀據集首董士宏序則原集在嘉靖中曽經刋板然今福建所採進者僅屬抄本又據康太和序知當時已多闕逸今則并康序中所稱記盆魚序愚樂等作亦俱未見殆更為後人妄有刋削彌致散亡鈔録亦多舛誤彌失其真今就是集所存詩文各一卷重為訂正并從鄭嶽莆陽文獻鄭王臣莆風清籟集中録詩十首文二首為補遺一卷附綴於末以存梗概其詩沖淡清婉不落蹊徑文亦峻整有法度蓋其時何李未出文格未變故循循軌度猶不失明初先正之風焉乾隆四十六年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀竹巖集序自余束髮遊庠時則聞莆先輩竹巖柯先生以大魁官宫詹學士清德邃學流譽詞林私心實切嚮往比承乏翰苑咨詢故實見翰署之後有亭翼然曰柯亭有柏蒼然曰學士柏徘徊瞻眺相望依依令人欲執鞭以從無由也歲癸丑其從孫司徒郎在告竒純氏余友也授簡入京師以竹巖文集見示且屬為序余受讀而卒業焉其為詩沖淡清婉不落畦徑庶幾登陶謝王孟之堂其為文平妥整潔不事浮葩艷藻佶屈聲牙之習而風神氣格逈出凡近中如陳情疏復郡侯書與夫記盆魚序愚樂等作尤見其主持倫常翊扶世道挽正風俗視媕阿脂韋以譁世取寵者不同覽者不必生同其時已可想見其人矣蓋公之生也實鍾八壺之秀大魁之年兹山先鳴其擊於莆者匪小令少需之遘泰逢陽翼輔昌運其建樹必大可觀而官不過宫詹壽僅踰五十謂非數為之厄哉雖然公之聲華節概載諸國史郡乘耿耿如存其不朽者固自有在是集雖闕逸尚多然鳳凰芝草以少為瑞固知其必傳於世無疑也竒純氏積學礪行克世其家而搜遺訂誤是集之傳實賴之和生也晚步驟未能豈敢序公之文哉特以鄉邦後學仰止之私得附名其末為幸云爾嘉靖甲寅五月之望賜進士通議大夫南京禮部右侍郎前掌翰林院事侍講學士春坊諭德同修國史會典邑後學康大和謹序竹巖集序明興掄魁天下學士大夫仰之以為異人者有如莆竹巖柯公豫竊景慕久矣逮領符蒞郡謁鄉賢祠公神蓋凛凛然訪其家從孫希齋先生則先君同進士也因獲讀公集及吾師礪峰康先生首序益想見其為人從而嘆曰公沒幾何年遺文猶閟弗顯表章先哲非有司事哉乃捐金以佐鋟梓既成士宏謹拜手稽首綴於末簡曰昔者劉文安公評論東里芳洲之文東里若清廟九室寶瓉珠罍陳列就次元酒黃流迭祼而可以為古芳洲若泰山喬嶽一翠千里長岡作郡短壟作邑而可以為傑然則公文其古歟愚不敢僣評則反覆展玩而覺其古也而非迂也傑也而非竒也蓋砥躬炳業體物賁藻吐之裕如略無模擬之勞纎弱之態倬乎巨儒之偉撰宗匠之良規也其及第十年遂柄南宫文衡得士陳士賢拔第一歷宫詹翰林學士握院篆兩教李文正林文安諸公皆名臣前是被命主試應天舟過維揚有舉子暮夜投遺公付有司置於法鄉會程式之文至今誦之每大篇出重於鼎吕故京師有柯家文章之稱鄰郡柄貂氣焰薰灼欲得公一言竟不可致其文價之重以此內閣李文達公欲引共事薄海內外咸鬱具瞻之望使天假年以其文輝華綸誥藻飾禮樂足以辨冕於先朝竹帛於來世雖文達蔑之專美矣抑豫猶幸其立言者固在也夫翰苑為司馬公孫朝董班揚淵藪而於公手植雙柏亭亭百年護愛之而曰學士柏柏且爾况文之美以愛以傳乎是集詩若文實希齋先生編校希齋先生其源委蓋有所受云嘉靖乙卯春二月望日賜進士出身中憲大夫奉敕整飭兵備浙江按察司副使前守興化郡晉陵董士宏謹撰
