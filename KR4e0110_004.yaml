body:
  text: 中順大夫詹事府少詹事兼翰林院學士竹巖柯公行狀翰林院修撰門生吳希賢撰公諱潛字孟時别號竹巖行四姓柯氏先世石晋時大理評事公寶自泉之晋江遷莆田武盛里生宋户部員外郎峽户部生進士長陽尉濟長陽生潮陽令璿令之孫贈承事郎昱遷本邑安樂里族日以盛其所居山至今號為柯山承事生海豐令新之海豐令生海豐尉嶨由海陽至公之父原朴九世皆不仕公生有異質周歲家人示睟盤一無所顧惟取書展玩久之若有所悟者祖父異之曰是兒必以文章大吾門十歲就外傅喜賦詩十五能為舉子文時林知縣廷芳方行人澥二人以葩詩名郡中公從之遊能盡得其奧㫖正統癸亥徴補邑庠生明年甲子領福建鄉薦當赴禮闈以未忍離親弗果行戊辰試春官弗第為國子生景泰辛未廷試第一甲第一名授翰林院修撰公丰神秀頴資性持重言笑不茍其所與遊必斯文雅誼至傾倒無間非其類雖逹官要人氣焰薰灼遇之不交一語當是時翰林諸老多為之引譽自是凡朝廷有選任有制作公皆與焉壬申四月升右春坊右中允兼修撰五月預修厯代君鍳癸酉書成賜白金文綺甲戌㑹試為同考官是歲五月預修地理志書三載秩滿進階承德郎封父原朴如其官母戴氏為安人贈封其配戴氏繼室俞氏皆安人丙子五月升司經局洗馬仍兼修撰七月命往應天考試舟經淮揚士有暮夜投公鬻私者公叱之曰爾急去毋自速罪戾其人謂公陽却之固以請以所賂遺公前公怒命執之付有司治以法是科場屋肅然録成稱得人為天下先還朝乞恩歸省未行英廟復辟改元天順更授公尚寶司少卿兼職如故仍許歸省戊寅十月還京己卯二月奉㫖修玉牒庚辰命偕吕學士原考禮部㑹試十二月命充東宫講讀官進階奉直大夫加封父中允公奉直大夫尚寶司少卿兼翰林院修撰壬午吕學士卒英廟御文華顧謂內閣臣李賢曰吕原卒內閣密命之地今翰林院文學之臣誰可嗣其任者賢首薦公曰具官臣柯潛清德粹文於今罕儷上然之己而弗果用癸未二月復命偕陳學士文考㑹試未竟㑹場火而罷甲申今上即位以侍從恩升翰林院學士三月有㫖選進士十八人李東陽等入翰林為庶吉士命公教以古文詞學希賢不肖預執業焉八月上御經筵敕公兼經筵官九月奉㫖纂修英廟實録成化改元八月主考順天鄉試九月玉牒成賜白金文綺丙戌殿試與讀卷是月再奉㫖教庶吉士林瀚等二十四人十月賜新刋貞觀政要一帙十二月詔吏部臣簡文學之臣堪入內閣掌密命者數人以聞吏部王尚書翔復首薦公又不果用時命掌翰林公維持公正人心帖服八月進英廟實録升詹事府少詹事兼翰林院學士十月賜大明一統志戊子二月侍經筵講讀時禮部左侍郎虛位吏部臣疏乞以今閣老眉山萬先生及公充之二人皆極翰林一時之選且意階是可獲大用名既上公復不果用七月詔下議慈懿太后山陵事公率僚屬上章論合葬於禮為宜詞甚剴切既而文武羣臣又合詞上請制可之十二月賜經筵儒臣七人襲衣冠履時公已聞少卿公喪即其家賜之既而有司為少卿公請祭公陳情且乞營葬或謂公乞葬於禮非宜公曰人子患不能厚葬其親吾盡吾心而己得請與否非所較也幸而獲請雖死且不朽上念公經筵勞併與之葬蓋異數也公受恩感激銜哀就道抵家擇葬地于祖居東一里許和溫山公既奉几筵第圖繪形式付其弟通州學正江董成之時母太宜人在堂庚寅正月太宜人屬疾卒朝廷遣官諭祭辛卯四月有詔起復時祭酒員缺久難其人上知公剛方將用之公聞命具疏辭乞終制大略言奪情非令典忠君者必自孝始未有不能盡孝于家而能盡忠于國者也上覽疏許之初公素無疾至是以久寢苫塊患左足風痺比免喪久之猶未平而寒疾繼作矣公自必不起呼學正君與之訣而逝時癸已年八月十八日也距其生永樂癸卯十二月初六日年五十一娶戴氏先卒繼娶俞氏前南京禮部侍郎綱之女側室王氏子一宗文王氏出公早有二子皆不育泊宗文生適吏部薦公入閣弗獲命學士永新劉先生戲謂公曰入閣與有子孰多公笑而弗答女二長適饒州府學鄭教授之子邑庠生叔寬次亦夭俱戴出俞宜人有賢行事舅姑內外無間言撫宗文如已出公身後可無憾矣公平生負直氣操行介持發而為文峻整有法類其為人尤長吟咏興至舉筆立就清新微婉綽有風致所著有竹巖集稿若干卷性尤喜言遊供職之暇偕諸知己窮覽勝概雅歌投壺分韻賦詩襟度豁如也既綜院事修飾公宇即詞林後圃結清風亭鑿池蒔蓮决渠引泉公退宴坐其中又翛然若真登瀛洲者至於遇事感發言論侃侃揚榷古今毅然自負噫如公者可謂動靜不違守之以正者矣故雖官庶僚已繫天下之望位日通顯望日隆重雖嘗以聖賢之學經濟之謀啓沃聖心而未見柄用夫用不用非所以論公也公孝友天性愛二弟撫育從子始終無間因念季弟之早亡也悉以先公所搆寢室讓與其子宗璧而自與學正君别作室于都㕔之東西以儉約自居而其睦族人也尤篤恩意先是族有戍瞿塘者父子相繼死溺一子清尚幼未有知識公聞之惻然亟取以來以長以教洎有立始遣歸其行義大都如此公之卒也巡撫福建都御史江浦張公以聞宗文遂以某年月日葬公先期遣人走京師乞銘表於當朝巨公謂希賢故門生宜有述希賢愚不肖聞公將北上方以晨夕得親炙為慶奚忍遽聞其訃而與之永訣耶又奚忍執筆而為之論撰耶雖然師生義重不可終辭敬録公履厯之大者如右庶立言君子有所採擇云像贊從吾彭韶題髙材逺韻清標粹學掄魁之中嶄然頭角玉堂賔詹斂博施約四海欽之北斗喬嶽若䆒其用庶興禮樂遊文峰巖詩稿跋門生吳希賢題竹巖柯先生以文章雄一世曩在翰林嘗奉上命以文章教希賢輩庶吉士十八人希賢愚不肖先生不鄙所以相汲引甚至先生為人風度凝逺胸次灑落故發之詩篇率清新俊邁如登千仭之岡天風颯至爽氣襲人而此二章乃遊文峰所作時先生約王君原雍偕行王君以事弗克赴既歸録以示一時登覽之勝字畫髙古實先生所自書先生於人少許可獨雅厚王君亦斯文之情味有同焉者詩之録夫豈虛辱乎哉王君求識一言希賢獨念先生負天下之望進不得為伊為周道業以宏詎意别去數載九原不可作矣觀此㑹令人徒抱無涯之悲嗚乎其無涯之悲也夫
